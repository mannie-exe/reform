[tools]
dprint = "0.51.1"
actionlint = "1.7.12"
"aqua:aquasecurity/trivy" = "0.76.2"

[tasks.check]
description = "Check formatting, docs, tests and packaged artifacts"
run = ["dprint check", "actionlint", "./gradlew --no-daemon check build"]

[tasks.format]
description = "Format Java and Markdown"
run = ["./gradlew --no-daemon spotlessApply", "dprint fmt"]

[tasks."format:markdown"]
description = "Format Markdown without fixed-width prose wrapping"
run = "dprint fmt"

[tasks."format:markdown:check"]
description = "Check Markdown formatting"
run = "dprint check"

[tasks."check:docs"]
description = "Check Markdown formatting and local links"
run = ["dprint check", "python3 tools/check_docs.py"]

[tasks."check:ci"]
description = "Validate GitHub Actions syntax and expressions"
run = "actionlint"

[tasks."check:security"]
description = "Scan resolved library dependencies and source secrets"
run = [
  "./gradlew --no-daemon -I tools/security.init.gradle securityDependencies --write-locks",
  "trivy fs --config trivy.yaml --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format json --output build/security-dependencies.json build/security",
  "python3 tools/review_security.py build/security-dependencies.json",
  "trivy fs --config trivy.yaml --scanners secret --severity HIGH,CRITICAL --exit-code 1 --format json --output build/security-secrets.json .",
]
