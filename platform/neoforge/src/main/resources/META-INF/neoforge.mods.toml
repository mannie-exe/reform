modLoader="javafml"
loaderVersion="${fmlVersionRange}"
license="Apache-2.0"
issueTrackerURL="https://github.com/mannie-exe/reform/issues"

[[mods]]
modId="reform"
version="${version}"
displayName="re:form"
authors="inherent.design contributors"
displayURL="https://github.com/mannie-exe/reform"
description='''Native configuration editing and command services for Minecraft mods.'''

[[mixins]]
config="reform.client.mixins.json"

[[dependencies.reform]]
modId="minecraft"
type="required"
versionRange="[${minecraft}]"
side="BOTH"

[[dependencies.reform]]
modId="neoforge"
type="required"
versionRange="[${loader},${loaderUpperBound})"
side="BOTH"

[features.reform]
javaVersion="[${javaVersion},)"

[[dependencies.reform]]
modId="jei"
type="optional"
versionRange="[${jei},${jeiUpper})"
side="CLIENT"
