plugins {
    id 'base'
    alias(libs.plugins.moddev) apply false
    alias(libs.plugins.spotless)
}

repositories { mavenCentral() }

allprojects {
    group = 'design.inherent'
    version = providers.gradleProperty('mod_version').get()
}

def distributionPomName = "reform-${project.version}.pom"

spotless {
    java {
        target 'examples/**/src/**/*.java'
        googleJavaFormat(libs.versions.google.java.format.get())
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

subprojects {
    apply plugin: 'com.diffplug.spotless'

    plugins.withId('java') {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(21)
            withSourcesJar()
        }
        tasks.withType(JavaCompile).configureEach {
            options.release = 21
            options.encoding = 'UTF-8'
            options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
        }
        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            maxParallelForks = 1
        }
        tasks.withType(AbstractArchiveTask).configureEach {
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
        tasks.withType(Jar).configureEach {
            from rootProject.file('LICENSE'), rootProject.file('NOTICE')
        }
        spotless {
            java {
                target 'src/**/*.java'
                googleJavaFormat(rootProject.libs.versions.google.java.format.get())
                removeUnusedImports()
                trimTrailingWhitespace()
                endWithNewline()
            }
        }
    }
}

tasks.register('checkDocs', Exec) {
    group = 'verification'
    description = 'Check maintained Markdown links without network requests.'
    commandLine 'python3', 'tools/check_docs.py'
    inputs.files(fileTree('.') {
        include '**/*.md'
        exclude '**/build/**', '**/.gradle/**', '**/runs/**', '.git/**'
    })
    inputs.file 'tools/check_docs.py'
}

tasks.register('verifyDistribution', Exec) {
    group = 'verification'
    description = 'Check mod identity, Java baseline, bundled code and publication metadata.'
    dependsOn ':core:jar', ':neoforge:jar', ':neoforge:sourcesJar'
    dependsOn ':neoforge:generatePomFileForMavenJavaPublication'
    commandLine 'python3', 'tools/verify_distribution.py', project.version.toString()
}

tasks.register('stageDistribution', Sync) {
    group = 'distribution'
    description = 'Stage the verified installable JAR, sources and Maven metadata.'
    dependsOn 'verifyDistribution'
    into layout.buildDirectory.dir('distributions')
    from project(':neoforge').tasks.named('jar')
    from project(':neoforge').tasks.named('sourcesJar')
    from(project(':neoforge').layout.buildDirectory.file('publications/mavenJava/pom-default.xml')) {
        rename { distributionPomName }
    }
}

tasks.register('toolTests', Exec) {
    group = 'verification'
    description = 'Exercise artifact refusals and release staging without publishing.'
    dependsOn 'verifyDistribution'
    commandLine 'python3', '-m', 'unittest', 'discover', '-s', 'tools/tests', '-v'
}

tasks.register('verifyPublicConsumer', GradleBuild) {
    group = 'verification'
    description = 'Compile/run an independent headless consumer against published local artifacts.'
    dependsOn ':neoforge:publishMavenJavaPublicationToStagingRepository'
    dir = file('examples/headless')
    tasks = ['run']
    def artifact = project(':neoforge').tasks.named('jar').flatMap { it.archiveFile }
    def releaseVersion = project.version.toString()
    doFirst {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
            .digest(artifact.get().asFile.bytes).encodeHex().toString()
        startParameter.projectProperties = [reformVersion: releaseVersion, reformSha256: digest]
    }
}

tasks.named('check') {
    dependsOn ':core:check', ':neoforge:check', 'checkDocs', 'verifyDistribution', 'toolTests', 'verifyPublicConsumer'
}
tasks.named('assemble') { dependsOn ':core:assemble', ':neoforge:assemble', 'stageDistribution' }
