name: Security Scan

on:
  workflow_call:
    inputs:
      dependency-artifact:
        description: Resolved inventory from this workflow's checked Linux build
        type: string
        default: ''
  schedule:
    - cron: '0 8 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: inputs.dependency-artifact == ''
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: inputs.dependency-artifact == ''
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Resolve library and test dependencies
        if: inputs.dependency-artifact == ''
        run: ./gradlew --no-daemon -I tools/security.init.gradle securityDependencies --write-locks
      - name: Download checked dependency inventory
        if: inputs.dependency-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.dependency-artifact }}
          path: build/security
      - name: Report resolved dependency vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2 # renovate: depName=aquasecurity/trivy
          scan-type: fs
          scan-ref: build/security
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: json
          output: build/security-dependencies.json
          trivy-config: trivy.yaml
      - name: Review dependency ownership
        run: python3 tools/review_security.py build/security-dependencies.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Scan source for secrets
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: build/security-secrets.json
          trivy-config: trivy.yaml
      - name: Retain security findings and review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-review
          path: |
            build/security-dependencies.json
            build/security-review.json
            build/security-secrets.json
          if-no-files-found: error
