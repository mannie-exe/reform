plugins { alias(libs.plugins.moddev) }
apply from: rootProject.file('gradle/neoforge-target.gradle')

sourceSets {
    nativeProbe {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

def nativeProbeEnabled = providers.gradleProperty('nativeProbe').map { it.toBoolean() }.getOrElse(false)

neoForge {
    if (nativeProbeEnabled) {
        mods { reform_native_probe { sourceSet sourceSets.nativeProbe } }
        runs {
            nativeProbeServer {
                server()
                gameDirectory = file('runs/native-config')
                programArgument '--nogui'
                jvmArgument '-Xmx2G'
            }
        }
    }
}

tasks.register('nativeProbeJar', Jar) {
    group = 'verification'
    description = 'Build the opt-in, non-distributed native settings fixture.'
    archiveFileName = 'reform-native-probe.jar'
    from sourceSets.nativeProbe.output
}
tasks.named('check') { dependsOn 'nativeProbeClasses' }

// Native matrix/PoseStack math requires the actual game classpath; ordinary unit tests remain neutral.
tasks.register('nativeCameraRegression', JavaExec) {
    group = 'verification'
    description = 'Compare native camera transforms with the shared projection without starting a client.'
    dependsOn 'nativeProbeClasses'
    classpath = sourceSets.nativeProbe.runtimeClasspath + project(':core').sourceSets.main.output
    mainClass = 'design.inherent.reform.minecraft.client.NativeCameraRegression'
    workingDir = layout.buildDirectory.dir('native-camera-regression').get().asFile
    doFirst { workingDir.mkdirs() }
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn 'nativeCameraRegression' }
